x-app: &app
  build:
    context: .
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  image: matchday-app
  volumes:
    - .:/app
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      SERVER_NAME: ":8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--queue=analytics,default", "--tries=3", "--backoff=5"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'queue:work' /proc/1/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'schedule:work' /proc/1/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Selenium for Dusk; only runs with `make dusk` (profile "dusk").
  # Shares the app container's network, so the browser reaches the app as
  # http://localhost:8000: Chrome never upgrades localhost to HTTPS, and it is
  # a secure context for browser APIs
  browser:
    image: selenium/standalone-chromium:latest
    profiles: ["dusk"]
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_healthy
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | grep -q '\"ready\": true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-matchday}
      MYSQL_USER: ${DB_USERNAME:-matchday}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
