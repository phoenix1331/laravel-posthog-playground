x-app: &app
  build:
    context: .
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  image: matchday-app
  volumes:
    - .:/app
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      SERVER_NAME: ":8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'queue:work' /proc/1/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-matchday}
      MYSQL_USER: ${DB_USERNAME:-matchday}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
